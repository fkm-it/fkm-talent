<style>
/* ===== FKM Talent — rupa sistem lama (sidebar, kad KPI, carta Chart.js, jadual) =====
 * Semua kelas berawalan fk- dan diskop di bawah .fk supaya tidak bertembung dengan CSS templat. */
.fk{--bg:#eef2f9;--surface:rgba(255,255,255,.72);--surface-solid:#fff;--border:rgba(16,42,86,.10);--text:#0e1b33;--muted:#5b6b88;--faint:#8a99b5;

--shadow:0 1px 2px rgba(11,61,145,.05),0 8px 28px rgba(11,61,145,.09);--shadow-lg:0 20px 60px rgba(11,61,145,.16);--radius:16px;--sidebar:250px;
color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}

--brand:#5b8ff5;--brand2:#3b6fd4;--brand-soft:rgba(91,143,245,.14);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.42);--shadow-lg:0 20px 60px rgba(0,0,0,.55)}

.fk-bar>i{display:block;height:100%;border-radius:20px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.fk-mini{font-size:11px;color:var(--muted)}

.fk-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:9px;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap}

.fk-alert{padding:13px 16px;border-radius:12px;font-size:12.5px;line-height:1.6;margin-bottom:16px;background:rgba(232,163,23,.11);border-left:3px solid var(--amber)}

<script>
/**
 * FKM Talent — antara muka mengikut rupa sistem lama (12 halaman, sidebar, kad KPI, carta Chart.js).
 * Shell sendiri untuk susun atur 'app' (KD.shells.app); panel pentadbir templat (/admin) kekal.
 * Data: SATU panggilan staf.data (ditapis ikut capaian & skor dikira di pelayan), dicache dalam memori 5 minit.
 * Semua HTML melalui html`` (auto-escape). Tiada pengendali acara sebaris (CSP).
 */
(function (KD) {
  'use strict';
  const { html, raw, qs, qsa, on, debounce, fmtNum } = KD.utils;
  const { toast, toastError } = KD.ui;

  /* ================================================================ DATA */
  const TTL = 5 * 60 * 1000;
  const fkm = {
    data: null, at: 0, pending: null,
    async load(force) {
      if (!force && fkm.data && Date.now() - fkm.at < TTL) return fkm.data;
      if (fkm.pending) return fkm.pending;
      fkm.pending = KD.api.call('staf.data').then((d) => { fkm.data = d; fkm.at = Date.now(); return d; }).finally(() => { fkm.pending = null; });
      return fkm.pending;
    },
    invalidate() { fkm.data = null; fkm.at = 0; },
    base() { return '/fkm'; },
    all(d, withInactive) { return withInactive ? d.staff : d.staff.filter((s) => s.aktif); },
    find(d, sid) { return d.staff.filter((s) => s.sid === String(sid))[0]; },
    dept(d, code) { return (d.jabatan && d.jabatan[code]) || code || '—'; },
    fullName(s) { return ((s.gelaran ? s.gelaran + ' ' : '') + s.nama).trim(); }
  };
  KD.fkm = fkm;
  /* Data lapuk selepas log keluar / log masuk akaun lain */
  window.addEventListener('hashchange', () => { if (KD.auth && !KD.auth.loggedIn()) { fkm.invalidate(); SHOW_OFF = false; } });

  let SHOW_OFF = false; /* "Tunjuk staf tidak aktif" — terpakai pada semua halaman (seperti sistem lama) */
  const vis = (d) => fkm.all(d, SHOW_OFF);
  const sum = (a, f) => a.reduce((t, x) => t + (Number(f(x)) || 0), 0);
  const avg = (a, f) => (a.length ? sum(a, f) / a.length : 0);
  const pct = (n, d) => (d ? Math.round((n / d) * 100) : 0);
  const grp = (a, f) => { const m = {}; a.forEach((x) => { const k = f(x) || 'TIDAK DINYATAKAN'; m[k] = (m[k] || 0) + 1; }); return m; };
  const dl = (a) => Object.keys(grp(a, (s) => s.jabatan)).sort();
  const isMadya = (s) => /madya|assoc/i.test(s.jawatan || '');
  const isProf = (s) => /^\s*prof/i.test(s.jawatan || '') && !isMadya(s);
  const YEARS = ['2020', '2021', '2022', '2023', '2024', '2025'];
  const cut = (t, n) => (t.length > n ? t.slice(0, n - 2) + '…' : t);
  const anugerah = (s) => s.anugerah.a + s.anugerah.k + s.anugerah.u;
  const khidmatAk = (s) => s.vivaD + s.vivaL + s.penilai + s.pewasit;
  const jkAll = (s) => s.jk.a + s.jk.k + s.jk.u + s.jk.f;

  const BAND = { HIJAU: ['GREEN', 'b-green', 'var(--green)'], KUNING: ['YELLOW', 'b-amber', 'var(--amber)'], MERAH: ['RED', 'b-red', 'var(--red)'] };
  const band = (sk) => BAND[sk.jalur] || BAND.MERAH;

  /* ================================================================ BLOK UI (gaya lama) */
  const kpi = (val, lbl, acc, ico) => html`<div class="fk-kpi" style="--acc:var(${acc || '--brand'})">${ico ? html`<div class="fk-kpi-ico">${ico}</div>` : ''}<div class="fk-kpi-val">${val}</div><div class="fk-kpi-lbl">${lbl}</div></div>`;
  const card = (title, sub, body, extra) => html`<div class="fk-card ${extra || ''}"><div class="fk-card-title">${title}</div>${sub ? html`<div class="fk-card-sub">${sub}</div>` : ''}${body}</div>`;
  const chartCard = (title, sub, id) => card(title, sub, html`<div class="fk-chart-box"><canvas data-chart="${id}" role="img" aria-label="${title}"></canvas></div>`);
  const tbl = (head, rows, emptyMsg) => html`<div class="fk-tbl-wrap"><table><thead><tr>${head.map((h) => html`<th>${h}</th>`)}</tr></thead><tbody>${rows.length ? rows : html`<tr><td colspan="${head.length}" style="text-align:center;padding:30px;color:var(--faint)">${emptyMsg || 'Tiada rekod dipadankan.'}</td></tr>`}</tbody></table></div>`;
  const dept = (s) => html`<span class="fk-badge b-blue">${s.jabatan || '—'}</span>`;
  const bar = (v, color, w) => html`<div class="fk-inline" style="flex-wrap:nowrap"><div class="fk-bar" style="width:${w || 62}px"><i style="width:${Math.max(0, Math.min(100, v))}%;background:${color}"></i></div><strong>${v}%</strong></div>`;
  const statusBadge = (s) => html`<span class="fk-badge ${String(s.khidmat).toUpperCase() === 'PERMANENT' ? 'b-green' : 'b-amber'}">${s.khidmat || '—'}</span>`;
  const note = (text) => html`<div class="fk-card fk-note"><div class="fk-card-sub">ⓘ ${text}</div></div>`;

  /* Cincin skor (SVG; nombor & nama pemboleh ubah CSS tetap sahaja dimasukkan secara mentah). */

      '<text x="50" y="' + (label === false ? 52 : 49) + '" text-anchor="middle" font-size="' + (label === false ? 20 : 21) + '" font-weight="750" fill="var(--text)">' + v + '%</text>' +
      (label === false ? '' : '<text x="50" y="63" text-anchor="middle" font-size="8" fill="var(--faint)">READINESS</text>') + '</svg>';
  }

  /* ================================================================ CARTA (Chart.js 4.4.1, dimuat malas) */
  let chartP = null;
  const CHARTS = [];
  function loadChart() {
    if (window.Chart) return Promise.resolve(window.Chart);
    if (chartP) return chartP;
    /* GitHub Pages: salinan tempatan (CSP script-src 'self'). Iframe Apps Script: CDN. */
    const local = !/googleusercontent\.com$|script\.google\.com$/.test(location.hostname);
    const src = local ? 'vendor/chartjs/chart.umd.min.js' : 'https:' + '\/\/cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';
    chartP = new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = src;
      sc.onload = () => resolve(window.Chart);
      sc.onerror = () => { chartP = null; reject(new Error('Carta gagal dimuatkan. Semak sambungan internet.')); };
      document.head.appendChild(sc);
    });
    return chartP;
  }
  function destroyCharts() { CHARTS.splice(0).forEach((c) => { try { c.destroy(); } catch (e) { /* abaikan */ } }); }
  const cssv = (n) => getComputedStyle(qs('.fk-app') || document.body).getPropertyValue(n).trim();
  const PAL = () => ['--brand', '--purple', '--teal', '--amber', '--green', '--red'].map(cssv).concat('#9aa8c4');
  const legendBottom = () => ({ legend: { position: 'bottom', labels: { color: cssv('--muted'), font: { size: 11 }, boxWidth: 12, padding: 14 } } });
  function mk(root, id, type, data, opt) {
    loadChart().then((Chart) => {
      const el = qs('canvas[data-chart="' + id + '"]', root);
      if (!el || !el.isConnected) return;
      const base = { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: cssv('--muted'), font: { size: 11 }, boxWidth: 12, padding: 14 } } } };
      if (type !== 'doughnut' && type !== 'pie' && type !== 'radar') {
        base.scales = { x: { ticks: { color: cssv('--faint'), font: { size: 10.5 } }, grid: { color: cssv('--border') } },
          y: { ticks: { color: cssv('--faint'), font: { size: 10.5 } }, grid: { color: cssv('--border') }, beginAtZero: true } };
      }
      CHARTS.push(new Chart(el, { type: type, data: data, options: Object.assign(base, opt || {}) }));
    }).catch((e) => {
      const el = qs('canvas[data-chart="' + id + '"]', root);
      if (el && el.parentNode) el.parentNode.innerHTML = html`<p class="fk-mini" style="padding:40px 10px;text-align:center">${e.message}</p>`.s;
    });
  }
  const yNoGrid = (max) => ({ y: { max: max, beginAtZero: true, ticks: { color: cssv('--faint') }, grid: { color: cssv('--border') } }, x: { ticks: { color: cssv('--faint') }, grid: { display: false } } });
  const hScales = (max) => ({ x: { max: max, beginAtZero: true, ticks: { color: cssv('--faint') }, grid: { color: cssv('--border') } }, y: { ticks: { color: cssv('--faint'), font: { size: 10 } }, grid: { display: false } } });

    ['/utama', '▦', 'Executive Dashboard', 'Ringkasan strategik bakat akademik FKM', 'ADMIN DEAN HOD', 'user'],
    ['/fkm/staf', '☰', 'Staff Profile', 'Direktori dan profil staf akademik', ALL, 'user'],
    ['/fkm/kenaikan', '▲', 'Promotion Readiness', 'Skor kesiapsiagaan kenaikan pangkat', ALL, 'user'],
    ['/fkm/latihan', '◎', 'Training Intelligence', 'Pematuhan dan analisis latihan', ALL, 'user'],
    ['/fkm/penyelidikan', '◇', 'Research Performance', 'Penerbitan, sitasi dan indeks-H', ALL, 'user'],

  }

  const modal = {
    el: () => qs('[data-fk-modal]'),
    show(content, narrow) {
      const m = modal.el();
      if (!m) return null;
      /* Elemen baharu setiap kali — pendengar acara kandungan lama dibuang bersama */
      const old = qs('[data-fk-modal-body]', m);
      const body = old.cloneNode(false);
      old.replaceWith(body);
      body.className = 'fk-modal-body' + (narrow ? ' narrow' : '');
      body.innerHTML = html`<button class="fk-modal-close" data-act="fk-close" aria-label="Tutup">×</button>${content}`.s;
      m.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      const f = qs('[data-autofocus]', body) || qs('.fk-modal-close', body);
      if (f) f.focus();
      return body;
    },
    close() {
      const m = modal.el();
      if (!m || m.classList.contains('hidden')) return;
      m.classList.add('hidden');
      qs('[data-fk-modal-body]', m).innerHTML = '';
      document.body.style.overflow = '';
    }
  };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.close(); });

  function openPasswordModal() {
    const b = modal.show(html`<div class="fk-card-title" style="font-size:17px">Tukar Kata Laluan</div><div class="fk-card-sub">Minimum 8 aksara, gabungan huruf dan nombor. Sesi pada peranti lain akan ditamatkan.</div>
      <form data-fk-pw><label class="fk-lbl" for="fkPw0">Kata laluan semasa</label><input type="password" id="fkPw0" name="cur" autocomplete="current-password" required data-autofocus>

        <label class="fk-lbl" for="fkPw2">Sahkan kata laluan baharu</label><input type="password" id="fkPw2" name="n2" autocomplete="new-password" required minlength="8">
        <p class="fk-mini" data-err style="color:var(--red);min-height:16px;margin:12px 0 0"></p>
        <button class="fk-btn-primary fk-btn-block" type="submit" style="margin-top:14px">Simpan Kata Laluan</button></form>`, true);
    if (!b) return;
    on(b, 'submit', '[data-fk-pw]', async (e, form) => {
      e.preventDefault();

      if (form.n1.value !== form.n2.value) { err.textContent = 'Kata laluan baharu tidak sepadan.'; return; }
      const btn = qs('button[type=submit]', form);
      KD.ui.busy(btn, async () => {
        try {
          await KD.api.changePassword({ currentPassword: form.cur.value, newPassword: form.n1.value });
          modal.close(); toast('Kata laluan berjaya ditukar.');

    });

  KD.shells.app = {

   * opts.roles: peranan yang dibenarkan (STAFF dialih ke profil sendiri); opts.allowEmpty: lukis walaupun tiada staf.

  function page(fn, opts) {
    opts = opts || {};
    return {
      async render(el, params, query) {
        el.innerHTML = '<div class="fk-page"><div class="fk-loading">Memuatkan data…</div></div>';

      <div style="flex:1;min-width:230px"><div style="margin-bottom:14px"><span class="fk-badge ${b[1]}">${b[0]} — ${sk.label}</span></div>
      ${comps.map((r) => html`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;gap:8px"><span>${r[0]} <span class="fk-mini">(${r[2]}%)</span></span><strong>${r[1]}%</strong></div>
        <div class="fk-bar"><i style="width:${r[1]}%;background:${r[1] < r[3] ? 'var(--red)' : r[1] >= r[3] + 15 ? 'var(--green)' : 'var(--amber)'}"></i></div>${r[1] < r[3] ? html`<div class="fk-mini" style="color:var(--red)">Bawah minimum ${r[3]}%</div>` : ''}</div>`)}
      </div></div><div class="fk-section-h">Gap Analysis</div><ul class="fk-gap-list">${s.jurang.map((g) => html`<li><span class="fk-badge b-amber">${g[0]}</span><span>${g[1]}</span></li>`)}</ul></div>`;
  }

  /** Butang pentadbir pada profil (sunting, nyahaktif / lantik semula). */
  function adminBar(s, d) {
    if (d.access.peranan !== 'ADMIN') return '';
    return html`<div class="fk-btn-row"><a class="fk-btn" href="#/admin/staf/${s.id}/sunting">✎ Sunting Maklumat</a>
      ${s.aktif ? html`<button class="fk-btn danger" data-act="fk-deact" data-id="${s.id}">⛔ Nyahaktifkan Staf</button>` : html`<button class="fk-btn" data-act="fk-react" data-id="${s.id}">↻ Lantik Semula</button>`}
      <a class="fk-btn" href="#/admin/staf/${s.id}">☷ Rekod &amp; Audit</a></div>
      ${s.aktif ? '' : html`<div class="fk-alert red">Rekod ini <strong>tidak aktif</strong> (status: ${s.status}). Ia dikecualikan daripada semua KPI, carta dan skor kesiapsiagaan.</div>`}`;
  }

  function bindAdmin(root, d) {
    on(root, 'click', '[data-act="fk-deact"]', (e, btn) => {
      const s = d.staff.filter((x) => x.id === btn.getAttribute('data-id'))[0];
      if (!s) return;
      const m = KD.moduleOf('staf');
      const opts = ((m && m.statuses) || []).filter((x) => x.value !== 'AKTIF');
      const b = modal.show(html`<div class="fk-card-title" style="font-size:17px">Nyahaktifkan Staf</div><div class="fk-card-sub">${fkm.fullName(s)} · ID ${s.sid}</div>
        <div class="fk-alert">Staf tidak aktif dikecualikan daripada KPI dan carta. Capaian &amp; akaun log masuk staf ini juga dinyahaktif serta-merta.</div>
        <form data-fk-st><label class="fk-lbl" for="fkSt">Status baharu</label><select id="fkSt" name="status">${opts.map((o) => html`<option value="${o.value}">${o.label}</option>`)}</select>
        <label class="fk-lbl" for="fkStN">Catatan</label><input type="text" id="fkStN" name="note" maxlength="200" placeholder="cth. Bersara wajib 1 Nov 2026">
        <button class="fk-btn-primary fk-btn-block" type="submit" style="margin-top:18px">Sahkan</button></form>`, true);
      on(b, 'submit', '[data-fk-st]', (ev, form) => { ev.preventDefault(); applyStatus(s, form.status.value, form.note.value.trim() || 'Dinyahaktif melalui profil', qs('button', form)); });
    });
    on(root, 'click', '[data-act="fk-react"]', (e, btn) => {
      const s = d.staff.filter((x) => x.id === btn.getAttribute('data-id'))[0];
      if (s) applyStatus(s, 'AKTIF', 'Dilantik semula', btn);
    });
  }
  function applyStatus(s, status, noteText, btn) {
    KD.ui.busy(btn, async () => {
      try {
        await KD.api.setStatus('staf', s.id, status, noteText);
        fkm.invalidate(); modal.close();
        toast(status === 'AKTIF' ? 'Staf diaktifkan semula.' : 'Status staf dikemas kini.');
        KD.router.render();
      } catch (err) { toastError(err); }
    });
  }

  function openProfile(d, sid) {
    const s = fkm.find(d, sid);
    if (!s) return;
    const b = modal.show(html`${adminBar(s, d)}${profileHTML(s, d)}${gapCard(s, d)}`);
    if (b) bindAdmin(b, d);
  }

  function renderOwnProfile(w, d) {
    const s = fkm.find(d, d.access.skop);
    setTitle('Staff Profile', 'Profil, pencapaian dan analisis jurang anda');
    if (!s) { w.innerHTML = emptyCard('Profil tidak dijumpai', 'Rekod staf bagi akaun anda belum wujud. Hubungi Unit IT FKM.').s; return; }
    w.innerHTML = html`${profileHTML(s, d)}${gapCard(s, d)}`.s;
  }

  /* ================================================================ 1. EXECUTIVE DASHBOARD (/utama) */
  function renderExec(w, d) {
    const st = vis(d);
    const ready = st.filter((s) => s.sk.jalur !== 'MERAH').length;
    const byRank = grp(st, (s) => s.jawatan), byDept = grp(st, (s) => s.jabatan);
    w.innerHTML = html`<div class="fk-kpi-grid">
        ${kpi(fmtNum(st.length), 'Jumlah Staf Akademik', '--brand', '☻')}${kpi(st.filter(isProf).length, 'Profesor', '--purple', '♛')}
        ${kpi(st.filter(isMadya).length, 'Profesor Madya', '--teal', '♜')}${kpi(ready, 'Hampir/Layak Naik Pangkat', '--green', '▲')}
        ${kpi(fmtNum(Math.round(sum(st, (s) => s.jamLatihan))), 'Jumlah Jam Latihan', '--amber', '⏱')}${kpi(fmtNum(sum(st, (s) => s.pub)), 'Jumlah Publication', '--brand', '▤')}
        ${kpi(fmtNum(sum(st, (s) => s.geranAktif)), 'Geran Aktif', '--red', '◉')}</div>
      <div class="fk-grid2">${chartCard('Staff Distribution by Grade', 'Taburan mengikut gred jawatan akademik', 'c1')}${chartCard('Staff Distribution by Department', 'Taburan mengikut jabatan FKM', 'c2')}</div>
      <div class="fk-grid2">${chartCard('Promotion Readiness Trend', 'Purata skor kesiapsiagaan mengikut jabatan', 'c3')}${chartCard('Training Completion', 'Peratus pematuhan mengikut kategori latihan', 'c4')}</div>
      ${chartCard('Research Performance Trend', 'Penerbitan terkumpul FKM mengikut tahun', 'c5')}`.s;
    const min = d.cfg.latihanMinJam;
    mk(w, 'c1', 'bar', { labels: Object.keys(byRank), datasets: [{ data: Object.values(byRank), backgroundColor: PAL(), borderRadius: 8, maxBarThickness: 44 }] }, { plugins: { legend: { display: false } } });
    mk(w, 'c2', 'doughnut', { labels: Object.keys(byDept), datasets: [{ data: Object.values(byDept), backgroundColor: PAL(), borderWidth: 0 }] },
      { cutout: '62%', plugins: { legend: { position: window.innerWidth < 640 ? 'bottom' : 'right', labels: { color: cssv('--muted'), font: { size: 11 }, boxWidth: 12, padding: 12 } } } });
    const dp = Object.keys(byDept);
    mk(w, 'c3', 'bar', { labels: dp, datasets: [{ label: 'Purata Skor (%)', data: dp.map((x) => Math.round(avg(st.filter((s) => s.jabatan === x), (s) => s.sk.total))), backgroundColor: cssv('--brand'), borderRadius: 8, maxBarThickness: 40 }] }, { scales: yNoGrid(100) });
    mk(w, 'c4', 'bar', { labels: d.latihan.map((c) => cut(c[1], 18)), datasets: [{ label: '% Pematuhan', data: d.latihan.map((c) => pct(st.filter((s) => (s.latihan[c[0]] || 0) >= min).length, st.length)), backgroundColor: PAL(), borderRadius: 8 }] },
      { indexAxis: 'y', plugins: { legend: { display: false } }, scales: hScales(100) });
    mk(w, 'c5', 'line', { labels: YEARS, datasets: [{ label: 'Penerbitan', data: YEARS.map((y) => sum(st, (s) => s.trend[y])), borderColor: cssv('--brand'), backgroundColor: cssv('--brand-soft'), fill: true, tension: 0.4, borderWidth: 3, pointRadius: 5, pointBackgroundColor: cssv('--brand') }] });
  }
  KD.views.dashboard = page((w, d) => (d.access.peranan === 'STAFF' ? renderOwnProfile(w, d) : renderExec(w, d)));

  /* ================================================================ 2. STAFF PROFILE */
  KD.views.fkmStaf = page((w, d, params, query) => {
    if (d.access.peranan === 'STAFF') return renderOwnProfile(w, d);
    const base = fkm.all(d, true);
    const off = base.filter((s) => !s.aktif).length;
    const ranks = Object.keys(grp(base, (s) => s.jawatan)).sort();
    const stats = Object.keys(grp(base, (s) => s.khidmat)).sort();
    w.innerHTML = html`<div class="fk-toolbar"><input type="search" data-q placeholder="Cari nama, ID staf, e-mel atau bidang kepakaran…" aria-label="Cari staf" value="${query.q || ''}">
        <select data-f="jabatan" aria-label="Jabatan"><option value="">Semua Jabatan</option>${dl(base).map((x) => html`<option value="${x}">${x}</option>`)}</select>
        <select data-f="jawatan" aria-label="Gred"><option value="">Semua Gred</option>${ranks.map((x) => html`<option value="${x}">${x}</option>`)}</select>
        <select data-f="khidmat" aria-label="Status"><option value="">Semua Status</option>${stats.map((x) => html`<option value="${x}">${x}</option>`)}</select>
        ${d.access.peranan === 'ADMIN' ? html`<a class="fk-btn-primary fk-btn-block" href="#/admin/staf/baru">+ Tambah Staf</a>` : ''}</div>
      ${off ? html`<div class="fk-mini fk-inline" style="margin:-6px 0 14px"><label class="fk-check"><input type="checkbox" data-off ${SHOW_OFF ? raw('checked') : ''}><span>Tunjuk staf tidak aktif</span></label>
        <span class="fk-badge b-grey">${off} tidak aktif ${SHOW_OFF ? '(sedang dipaparkan)' : 'disembunyikan'}</span></div>` : ''}
      <div class="fk-card"><div class="fk-card-title">Direktori Staf Akademik</div><div class="fk-card-sub" data-count></div><div data-tbl></div></div>`.s;
    const draw = () => {
      const q = qs('[data-q]', w).value.trim().toLowerCase();
      const f = {}; qsa('[data-f]', w).forEach((el) => { f[el.getAttribute('data-f')] = el.value; });
      const rows = vis(d).filter((s) => (!f.jabatan || s.jabatan === f.jabatan) && (!f.jawatan || s.jawatan === f.jawatan) && (!f.khidmat || s.khidmat === f.khidmat) &&
        (!q || [s.nama, s.sid, s.email, s.kepakaran, s.niche, s.rg].join(' ').toLowerCase().indexOf(q) >= 0));
      qs('[data-count]', w).textContent = rows.length + ' daripada ' + vis(d).length + ' rekod · klik baris untuk profil penuh';
      qs('[data-tbl]', w).innerHTML = tbl(['Staf', 'Jabatan', 'Gred', 'Jawatan', 'Perkhidmatan', 'Status', 'Readiness'], rows.map((s) => html`<tr data-sid="${s.sid}" class="${s.aktif ? '' : 'off'}">
          <td><strong>${fkm.fullName(s)}</strong><div class="fk-mini">${s.email || '—'} · ID ${s.sid}</div></td><td>${dept(s)}</td><td>${s.gred || '—'}</td><td>${s.jp || '—'}</td>
          <td>${s.tempoh !== null ? s.tempoh + ' thn' : '—'}</td><td>${statusBadge(s)}</td><td>${bar(s.sk.total, band(s.sk)[2])}</td></tr>`)).s;
    };
    on(w, 'input', '[data-q]', debounce(draw, 150));
    on(w, 'change', '[data-f]', draw);
    on(w, 'change', '[data-off]', (e, c) => { SHOW_OFF = c.checked; KD.router.render(); });
    draw();
  });

  KD.views.fkmProfil = page((w, d, params) => {
    const s = fkm.find(d, params.sid);
    if (!s) { w.innerHTML = emptyCard('Profil tidak dijumpai', 'Rekod ini tiada atau di luar skop capaian anda.', html`<a class="fk-btn" href="#/fkm/staf">← Direktori staf</a>`).s; return; }
    setTitle('Staff Profile', fkm.fullName(s));
    w.innerHTML = html`${d.access.peranan !== 'STAFF' ? html`<div class="fk-btn-row"><a class="fk-btn" href="#/fkm/staf">← Direktori staf</a></div>` : ''}${adminBar(s, d)}${profileHTML(s, d)}${gapCard(s, d)}`.s;
    bindAdmin(w, d);
  });

  /* ================================================================ 3. PROMOTION READINESS */
  KD.views.fkmKenaikan = page((w, d) => {
    if (d.access.peranan === 'STAFF') { const me = fkm.find(d, d.access.skop); w.innerHTML = me ? gapCard(me, d).s : emptyCard('Profil tidak dijumpai', '').s; return; }
    const st = vis(d).map((s) => s).sort((a, b) => b.sk.total - a.sk.total);
    const g = st.filter((s) => s.sk.jalur === 'HIJAU').length, y = st.filter((s) => s.sk.jalur === 'KUNING').length, r = st.length - g - y;
    const W = d.cfg.bobot;
    w.innerHTML = html`<div class="fk-kpi-grid">${kpi(g, 'GREEN · Ready to apply', '--green')}${kpi(y, 'YELLOW · Almost ready', '--amber')}${kpi(r, 'RED · Need improvement', '--red')}${kpi(Math.round(avg(st, (s) => s.sk.total)) + '%', 'Purata Skor Fakulti', '--brand')}</div>
      <div class="fk-grid2">${chartCard('Taburan Status Kesiapsiagaan', 'Penyelidikan ' + W.penyelidikan + '% · Pengajaran ' + W.pengajaran + '% · Khidmat ' + W.khidmat + '% · Kepimpinan ' + W.kepimpinan + '% · Min LPPT ' + d.cfg.lpptMinimum + '%', 'p1')}
        ${chartCard('Purata Komponen Skor', 'Kekuatan dan kelemahan kolektif fakulti', 'p2')}</div>
      ${card('Senarai Kesiapsiagaan Staf', 'Disusun mengikut skor tertinggi · klik untuk gap analysis penuh · Hijau ≥ ' + d.cfg.jalur.hijau + '%, Kuning ≥ ' + d.cfg.jalur.kuning + '%',
        tbl(['Staf', 'Jabatan', 'Sasaran', 'Skor', 'Status', 'Gap Utama'], st.map((s) => html`<tr data-sid="${s.sid}"><td><strong>${fkm.fullName(s)}</strong></td><td>${dept(s)}</td><td>${s.sk.sasaran}</td>
          <td>${bar(s.sk.total, band(s.sk)[2])}</td><td><span class="fk-badge ${band(s.sk)[1]}">${band(s.sk)[0]}</span></td><td class="fk-mini">${s.jurang[0][0]}</td></tr>`)))}`.s;
    mk(w, 'p1', 'doughnut', { labels: ['GREEN — Ready', 'YELLOW — Almost', 'RED — Improve'], datasets: [{ data: [g, y, r], backgroundColor: [cssv('--green'), cssv('--amber'), cssv('--red')], borderWidth: 0 }] }, { cutout: '62%', plugins: legendBottom() });
    mk(w, 'p2', 'radar', { labels: ['Penyelidikan', 'Pengajaran', 'Khidmat', 'Kepimpinan'], datasets: [{ label: 'Purata Fakulti', data: ['r', 't', 'k', 'l'].map((k) => Math.round(avg(st, (s) => s.sk[k]))),
      borderColor: cssv('--brand'), backgroundColor: cssv('--brand-soft'), borderWidth: 2, pointBackgroundColor: cssv('--brand') }] },
    { scales: { r: { beginAtZero: true, max: 100, grid: { color: cssv('--border') }, angleLines: { color: cssv('--border') }, pointLabels: { color: cssv('--muted'), font: { size: 11 } }, ticks: { display: false } } } });
  });

  /* ================================================================ 4. TRAINING INTELLIGENCE */
  KD.views.fkmLatihan = page((w, d) => {
    const st = vis(d), cats = d.latihan, min = d.cfg.latihanMinJam;
    const comp = cats.map((c) => pct(st.filter((s) => (s.latihan[c[0]] || 0) >= min).length, st.length));
    const mand = st.filter((s) => s.wajib).length;
    const total = sum(st, (s) => s.jamLatihan);
    w.innerHTML = html`<div class="fk-kpi-grid">${kpi(fmtNum(Math.round(total)), 'Jumlah Jam Latihan', '--brand')}${kpi((st.length ? total / st.length : 0).toFixed(1), 'Purata Jam / Staf', '--teal')}
        ${kpi(pct(mand, st.length) + '%', 'Pematuhan Latihan Wajib', '--green')}${kpi(st.length - mand, 'Staf Belum Patuh', '--red')}</div>
      ${card('Training Compliance by Category', 'Peratus staf mencapai minimum ' + min + ' jam bagi setiap kategori',
        html`${cats.map((c, i) => html`<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px"><strong>${c[1]}</strong><span>${comp[i]}%</span></div>
          <div class="fk-bar" style="height:9px"><i style="width:${comp[i]}%;background:${comp[i] >= 70 ? 'var(--green)' : comp[i] >= 45 ? 'var(--amber)' : 'var(--red)'}"></i></div></div>`)}`, '')}
      <div style="height:16px"></div>
      <div class="fk-grid2">${chartCard('Jumlah Jam Mengikut Kategori', 'Agregat jam latihan seluruh skop', 't1')}${chartCard('Purata Jam Latihan Mengikut Jabatan', 'Perbandingan komitmen latihan antara jabatan', 't2')}</div>
      ${card('Rekod Latihan Staf', 'Jam terkumpul mengikut kategori',
        tbl(['Staf', 'Jabatan'].concat(cats.map((c) => c[1].split(' ')[0]), ['Jumlah', 'Wajib']), st.slice().sort((a, b) => b.jamLatihan - a.jamLatihan).map((s) => html`<tr data-sid="${s.sid}"><td><strong>${s.nama}</strong></td><td>${dept(s)}</td>
          ${cats.map((c) => html`<td>${s.latihan[c[0]] || 0}</td>`)}<td><strong>${s.jamLatihan}</strong></td><td><span class="fk-badge ${s.wajib ? 'b-green' : 'b-red'}">${s.wajib ? 'LENGKAP' : 'BELUM'}</span></td></tr>`)))}`.s;
    mk(w, 't1', 'bar', { labels: cats.map((c) => cut(c[1], 16)), datasets: [{ data: cats.map((c) => Math.round(sum(st, (s) => s.latihan[c[0]]))), backgroundColor: PAL(), borderRadius: 8 }] },
      { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: cssv('--faint'), font: { size: 9.5 } }, grid: { display: false } }, y: { beginAtZero: true, ticks: { color: cssv('--faint') }, grid: { color: cssv('--border') } } } });
    const dp = dl(st);
    mk(w, 't2', 'bar', { labels: dp, datasets: [{ label: 'Purata Jam', data: dp.map((x) => Math.round(avg(st.filter((s) => s.jabatan === x), (s) => s.jamLatihan))), backgroundColor: cssv('--teal'), borderRadius: 8, maxBarThickness: 40 }] });
  });

  /* ================================================================ 5. RESEARCH PERFORMANCE */
  KD.views.fkmPenyelidikan = page((w, d) => {
    const st = vis(d);
    const q1 = sum(st, (s) => s.q1), q2 = sum(st, (s) => s.q2), pub = sum(st, (s) => s.pub);
    w.innerHTML = html`<div class="fk-kpi-grid">${kpi(fmtNum(pub), 'Jumlah Publication', '--brand')}${kpi(fmtNum(sum(st, (s) => s.scopus)), 'Scopus Indexed', '--purple')}
        ${kpi(fmtNum(sum(st, (s) => s.wos)), 'Web of Science', '--teal')}${kpi(fmtNum(q1), 'Q1 Publication', '--green')}${kpi(fmtNum(q2), 'Q2 Publication', '--amber')}
        ${kpi(fmtNum(sum(st, (s) => s.sitasi)), 'Jumlah Sitasi', '--red')}${kpi(avg(st, (s) => s.hindex).toFixed(1), 'Purata Indeks-H', '--brand')}</div>
      <div class="fk-grid2">${chartCard('Publication Trend', 'Penerbitan tahunan 2020–2025', 'r1')}${chartCard('Indexing & Quartile Breakdown', 'Taburan kualiti penerbitan', 'r2')}</div>
      <div style="margin-bottom:16px">${chartCard('Citation Impact by Research Alliance', 'Jumlah sitasi mengikut research alliance', 'r3')}</div>
      ${card('Top Researchers', 'Disusun mengikut indeks-H', tbl(['Staf', 'Jabatan', 'Publication', 'Q1', 'Q2', 'Scopus', 'WoS', 'Sitasi', 'Indeks-H'],
        st.slice().sort((a, b) => b.hindex - a.hindex || b.sitasi - a.sitasi).map((s) => html`<tr data-sid="${s.sid}"><td><strong>${s.nama}</strong><div class="fk-mini">${s.scopusId ? 'Scopus ID ' + s.scopusId : 'Tiada Scopus ID'}</div></td>
          <td>${dept(s)}</td><td>${s.pub}</td><td>${s.q1}</td><td>${s.q2}</td><td>${s.scopus}</td><td>${s.wos}</td><td>${fmtNum(s.sitasi)}</td><td><span class="fk-badge b-green">${s.hindex}</span></td></tr>`)))}`.s;
    mk(w, 'r1', 'line', { labels: YEARS, datasets: [{ label: 'Penerbitan', data: YEARS.map((y) => sum(st, (s) => s.trend[y])), borderColor: cssv('--brand'), backgroundColor: cssv('--brand-soft'), fill: true, tension: 0.4, borderWidth: 3, pointRadius: 5, pointBackgroundColor: cssv('--brand') }] });
    mk(w, 'r2', 'doughnut', { labels: ['Q1', 'Q2', 'Q3/Q4 & Lain'], datasets: [{ data: [q1, q2, Math.max(0, pub - q1 - q2)], backgroundColor: [cssv('--green'), cssv('--amber'), cssv('--faint')], borderWidth: 0 }] }, { cutout: '62%', plugins: legendBottom() });
    const al = Object.keys(grp(st, (s) => s.alliance));
    mk(w, 'r3', 'bar', { labels: al.map((a) => cut(a, 24)), datasets: [{ label: 'Sitasi', data: al.map((a) => sum(st.filter((s) => (s.alliance || 'TIDAK DINYATAKAN') === a), (s) => s.sitasi)), backgroundColor: PAL(), borderRadius: 8 }] },
      { indexAxis: 'y', plugins: { legend: { display: false } }, scales: hScales() });
  });

  /* ================================================================ 6. GRANT MANAGEMENT */
  KD.views.fkmGeran = page((w, d) => {
    const st = vis(d), total = sum(st, (s) => s.dana);
    w.innerHTML = html`<div class="fk-kpi-grid">${kpi('RM ' + (total / 1e6).toFixed(2) + 'j', 'Total Research Funding', '--green')}${kpi(fmtNum(sum(st, (s) => s.geran)), 'Jumlah Geran', '--brand')}
        ${kpi(fmtNum(sum(st, (s) => s.geranAktif)), 'Active Grants', '--red')}${kpi(st.filter((s) => s.pi > 0).length, 'Principal Investigator Count', '--purple')}
        ${kpi('RM ' + Math.round(st.length ? total / st.length / 1000 : 0) + 'k', 'Purata Dana / Staf', '--teal')}</div>
      <div class="fk-grid2">${chartCard('Pembiayaan Mengikut Jabatan', 'Jumlah dana penyelidikan (RM)', 'g1')}${chartCard('Geran Aktif vs Selesai', 'Status portfolio geran fakulti', 'g2')}</div>

  /* ================================================================ 10. AI CAREER ADVISOR (berasaskan peraturan, dalam pelayar) */
  function advise(s, d, q) {
    const sk = s.sk, cfg = d.cfg, t = cfg.sasaran[sk.sasaran] || cfg.sasaran.DS54, L = q.toLowerCase();
    if (/latihan|training|kursus/.test(L)) {
      const weak = d.latihan.filter((c) => (s.latihan[c[0]] || 0) < cfg.latihanMinJam);
      return 'Analisis Latihan\nJumlah jam terkumpul: ' + s.jamLatihan + ' jam. Status latihan wajib: ' + (s.wajib ? 'LENGKAP' : 'BELUM LENGKAP') + '.\n\n' +
        (weak.length ? 'Kategori di bawah paras minimum ' + cfg.latihanMinJam + ' jam:\n' + weak.map((c) => '• ' + c[1] + ' — ' + (s.latihan[c[0]] || 0) + ' jam').join('\n') +
          '\n\nCadangan: utamakan ' + weak[0][1] + '.' : 'Semua kategori telah melepasi paras minimum. Teruskan dengan kursus lanjutan dalam Artificial Intelligence dan Leadership untuk kelebihan kompetitif.');
    }
    if (/penyelidikan|research|publication|penerbitan|sitasi|jurnal/.test(L)) {
      return 'Prestasi Penyelidikan\n• Penerbitan: ' + s.pub + ' (Q1: ' + s.q1 + ', Q2: ' + s.q2 + ')\n• Scopus: ' + s.scopus + ' · WoS: ' + s.wos + '\n• Sitasi: ' + s.sitasi + ' · Indeks-H: ' + s.hindex +
        '\n\nKomponen Penyelidikan & Penerbitan anda: ' + sk.r + '% (wajaran ' + cfg.bobot.penyelidikan + '%). ' +
        (sk.r >= 75 ? 'Ini kekuatan utama anda — pastikan ia didokumentasikan dengan jelas dalam borang permohonan.' : 'Untuk sasaran ' + sk.sasaran + ', tumpukan pada jurnal Q1/Q2 (sasaran ' + t.q12 + ', kini ' + (s.q1 + s.q2) + ').');
    }
    if (/lama|tempoh|bila|berapa/.test(L)) {
      const rate = Math.max(1, ((s.trend['2024'] || 0) + (s.trend['2025'] || 0)) / 2);
      const need = Math.max(0, t.pub - s.pub);
      return 'Anggaran Tempoh\nKadar penerbitan 2 tahun terkini: ~' + rate.toFixed(1) + ' setahun. Jurang penerbitan untuk ' + sk.sasaran + ': ' + need + '.\n' +
        (need ? 'Anggaran ' + Math.ceil(need / rate) + ' tahun pada kadar semasa.' : 'Jurang penerbitan sudah ditutup.') +
        '\n\nTempoh ini boleh dipendekkan dengan: (1) kolaborasi antarabangsa untuk mempercepat penerbitan Q1, (2) memohon geran sebagai Principal Investigator, (3) penyeliaan bersama pelajar PhD.';
    }
    return 'Analisis Kesiapsiagaan — ' + fkm.fullName(s) + '\nReadiness semasa: ' + sk.total + '% · Status: ' + band(sk)[0] + ' (' + sk.label + ') · Sasaran: ' + sk.sasaran +
      '\n\nPecahan skor:\n• Penyelidikan & Penerbitan (' + cfg.bobot.penyelidikan + '%): ' + sk.r + '%\n• Pengajaran & Penyeliaan (' + cfg.bobot.pengajaran + '%): ' + sk.t + '%\n• Khidmat & Perundingan Industri (' + cfg.bobot.khidmat + '%): ' + sk.k + '%\n• Sanjungan & Kepimpinan (' + cfg.bobot.kepimpinan + '%): ' + sk.l + '%' +
      (sk.gagal.length ? '\n\nAmaran: ' + sk.gagal.join('; ') : '') + '\n\nCadangan:\n' + s.jurang.slice(0, 4).map((g, i) => (i + 1) + '. ' + g[0] + ': ' + g[1]).join('\n');
  }

  let pdfLoading = null;
  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (pdfLoading) return pdfLoading;
    /* GitHub Pages: salinan tempatan (CSP script-src 'self'). Iframe Apps Script: CDN. */
    const local = !/googleusercontent\.com$|script\.google\.com$/.test(location.hostname);
    const cdn = 'https:' + '\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    const base = local ? 'vendor/pdfjs/' : cdn;
    pdfLoading = new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = base + 'pdf.min.js';
      sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; resolve(window.pdfjsLib); };
      sc.onerror = () => { pdfLoading = null; reject(new Error('Pustaka PDF gagal dimuatkan. Semak sambungan internet.')); };
      document.head.appendChild(sc);
    });
    return pdfLoading;
  }

  async function readPdfText(file) {
    const lib = await loadPdfJs();
    const buf = new Uint8Array(await file.arrayBuffer());
    /* isEvalSupported:false menutup CVE-2024-4367 (PDF berniat jahat melaksanakan JavaScript) */
    const pdf = await lib.getDocument({ data: buf, isEvalSupported: false }).promise;
    let full = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const pg = await pdf.getPage(i);
      const tc = await pg.getTextContent();
      full += tc.items.map((t) => t.str).join(' ') + '\n';
      pg.cleanup();
    }
    pdf.destroy();
    return full;
  }

/* @cv-extract:start */
function extractCVfields(fullRaw){
  /* Normalize ALL whitespace (including page-break newlines from readPdfText) */
  /* to single spaces first -- this makes the extraction logic behave the */
  /* same regardless of whether the source text preserves internal line */
  /* breaks or not (real PDF.js text only breaks between pages, never */
  /* within a page's table rows/columns). */
  const full=fullRaw.replace(/\s+/g,' ').trim();
  const sm=full.match(/SUMMARY REPORT[\s\S]*/i); const summ=sm?sm[0]:full;
  const F=(p)=>{const m=full.match(p);return m?m[1].trim():null;};
  const S=(p)=>{const m=summ.match(p);return m?m[1].trim():null;};
  const N=(s)=>{if(!s)return 0;const m=String(s).replace(/\s/g,'').match(/[\d,]+\.?\d*/);return m?parseFloat(m[0].replace(/,/g,'')):0;};
  const d={};
  d.staff_id=F(/Staff ID\s+(\d+)/i);
  d.name=F(/Name\s+([A-Z][A-Z\s@'.\/-]+?)\s+Tel/i);
  d.email=F(/E-?mail\s+([^\s]+@[^\s]+)/i);
  d.scopus_id=F(/SCOPUS\s+(\d{6,})/i);
  /* LPPT: HANYA nombor yang terus mengikuti label (hingga 3, setiap satu 0-100).
   * PEMBETULAN (Okt 2026): regex lama [\s\S]*? melangkau ke nombor seterusnya dalam dokumen jika staf
   * belum ada markah LPPT — tahun/tarikh (cth. 2024, 2579) tersimpan sebagai LPPT dan "lulus" gatekeeper. */
  const lpm=full.match(/LPPT Marks(?:\s*\(\d+\s*years?\))?\s*((?:\d{1,3}(?:\.\d+)?\s+){0,3})/i);
  if(lpm){
    const v=lpm[1].trim().split(/\s+/).filter(Boolean).map(Number).filter(x=>x>=0&&x<=100);
    if(v.length>0)d.lppt_2025=v[0];
    if(v.length>1)d.lppt_2024=v[1];
    if(v.length>2)d.lppt_2023=v[2];
  }
  d.pub_wos=N(S(/ISI Article\/Journal WOS\s+(\d+)/i));
  d.pub_scopus=N(S(/Scopus Article\/Journal\s+(\d+)/i));
  d.pub_conf=N(S(/Indexed Conference Proceedings\s+(\d+)/i));
  d.pub_book=N(S(/Book Chapters?\s+(\d+)/i));
  /* Consultation Works: each category (UTM / Others) shows a "primary" */
  /* printed value right after the label, and -- for some staff -- a */
  /* "secondary" value PDF.js rendered as one character per text item */
  /* (vertically laid out in the source PDF table cell). Exactly one of the */
  /* two is the true nonzero value; summing both reproduces the correct */
  /* total. The primary is consumed first as clean text so only the */
  /* genuine leftover run gets de-verticalized. */
  d.consult_proj=0; d.consult_rm=0;
  const consBlockRe=/Consultation Project\s*-\s*(UTM|Others)([\s\S]*?)(?=Consultation Project\s*-\s*(?:UTM|Others)|INTERNATIONAL\/NATIONAL|$)/gi;
  let cb;
  while((cb=consBlockRe.exec(summ))!==null){
    const block=cb[2];
    const primRe=/^\s*(\d+)\s*projects?\s*RM\s*([\d,]+\.?\d*)/i;
    const pm=block.match(primRe);
    let rest=block;
    if(pm){ d.consult_proj+=+pm[1]; d.consult_rm+=N(pm[2]); rest=block.slice(pm.index+pm[0].length); }
    const unit='[0-9A-Za-z,.]';
    const runRe=new RegExp('^(?:'+unit+'(?:\\s'+unit+'){2,})');
    const restDV=rest.trim().replace(runRe,function(m){return m.replace(/\s+/g,'');});
    const vm2=restDV.match(/^(\d+)\s*projects?\s*RM\s*([\d,]+\.?\d*)/i);
    if(vm2){ d.consult_proj+=+vm2[1]; d.consult_rm+=N(vm2[2]); }
  }
  d.award_intl=N(S(/International Awards\/Honors\s+(\d+)/i));
  d.award_natl=N(S(/(?:^|[^\w])National Awards\/Honors\s+(\d+)/i));
  d.award_utm=N(S(/UTM Awards\/Honors\s+(\d+)/i));
  d.comm_intl=N(S(/International Committee\s+(\d+)/i));
  d.comm_natl=N(S(/(?:^|[^\w])National Committee\s+(\d+)/i));
  d.comm_univ=N(S(/University Committee\s+(\d+)/i));
  d.comm_fac=N(S(/Faculty Committee\s+(\d+)/i));
  const pmg=N(S(/Main Supervisor\s*[–-]\s*PhD \(Graduated\)\s+(\d+)/i));
  const pcg=N(S(/Co-Supervisor\s*[–-]\s*PhD \(Graduated\)\s+(\d+)/i));
  const pmo=N(S(/Main Supervisor\s*[–-]\s*PhD \(Ongoing\)\s+(\d+)/i));
  const pco=N(S(/Co-Supervisor\s*[–-]\s*PhD \(Ongoing\)\s+(\d+)/i));
  d.phd_grad=pmg+pcg; d.phd_ongoing=pmo+pco;
  const mv=summ.match(/Master by [^(]+\((?:Graduated|On-?Going)\)\s+(\d+)/gi)||[];
  d.master=mv.reduce((t,x)=>t+(+((x.match(/(\d+)\s*$/)||[])[1]||0)),0);
  /* "Undergraduates"/"Postgraduates" ialah JAM KREDIT (Total Credit Hours = UG + PG), bukan bilangan pelajar. */
  d.teach_ug=N(S(/Undergraduates\s+(\d+)/i));
  d.teach_pg=N(S(/Postgraduates\s+(\d+)/i));
  /* Grant funding (RM): sum PI + Member grant lines from SUMMARY REPORT */
  d.grant_pi=0; d.funding_pi=0; d.grant_member=0; d.funding_member=0;
  const grantRe=/(Principal Investigator|Member)-\s*(?:International|National|UTM)\s*Grants?\s+(\d+)\s*projects?\s*RM\s*([\d,]+\.?\d*)/gi;
  let gm;
  while((gm=grantRe.exec(summ))!==null){
    const n=+gm[2]; const rm=N(gm[3]);
    if(/Principal/i.test(gm[1])){ d.grant_pi+=n; d.funding_pi+=rm; } else { d.grant_member+=n; d.funding_member+=rm; }
  }
  d.funding=d.funding_pi+d.funding_member;
  d.viva_int=N(S(/MSc\.?\s*Internal Examiner\s+(\d+)/i))+N(S(/PhD Internal Examiner\s+(\d+)/i));
  d.viva_ext=N(S(/MSc\.?\s*External Examiner\s+(\d+)/i))+N(S(/PhD External Examiner\s+(\d+)/i));
  function sliceSection(text,startRe,stopMarkers){
    const sm2=text.match(startRe); if(!sm2)return null;
    const bodyStart=sm2.index+sm2[0].length; let bodyEnd=text.length;
    for(const marker of stopMarkers){ const i=text.indexOf(marker,bodyStart); if(i!==-1&&i<bodyEnd)bodyEnd=i; }
    return text.slice(bodyStart,bodyEnd);
  }
  d.copyright=0;
  const copyBody=sliceSection(full,/PROFESSIONAL SERVICES \(Copyright, Patent Granted and Filing\)/i,['PLENARY/','SUMMARY REPORT','Date of CV Academic Generated']);
  if(copyBody) d.copyright=(copyBody.match(/\bCOPYRIGHT\s+APPROVED\b/gi)||[]).length;
  /* Kiraan pengerusi/penceramah: kira tarikh acara dalam seksyen Plenary/Chairperson.
   * PEMBETULAN (Okt 2026): PDF.js memisahkan tarikh seperti "22/10 /2025" — regex lama (tanpa \s*) sentiasa 0. */
  d.chair_count=0;
  const chairBody=sliceSection(full,/PLENARY\/\s*CHAIRPERSON\/\s*ORAL POSTER PRESENTER\/\s*KEYNOTE ADDRESS\/\s*INVITED GUEST SPEAKER/i,['PROFESSIONAL SERVICES','SUMMARY REPORT','Date of CV Academic Generated']);
  if(chairBody) d.chair_count=(chairBody.match(/\b\d{1,2}\s*\/\s*\d{1,2}\s*\/\s*\d{4}\b/g)||[]).length;
  /* Pecahan kuartil Q0–Q4 daripada senarai penerbitan */
  d.q1=0; d.q2=0; d.q0=0; d.q3=0; d.q4=0;
  const pubBody=sliceSection(full,/LIST OF PUBLICATION \(INDEXED ARTICLE \/ REVIEW\)/i,['OTHER PUBLICATION','PLENARY/','SUMMARY REPORT','Date of CV Academic Generated']);
  if(pubBody){
    const rowRe=/PUBLICATI\s*ON IN\s*(?:WEB\s*OF SCIENCE|SCOPUS)\s*INDEXED\s*PUBLICATI\s*ON\s+(\d)\s+/gi;
    let rm2;
    while((rm2=rowRe.exec(pubBody))!==null){
      const q=+rm2[1];
      if(q===0)d.q0++; else if(q===1)d.q1++; else if(q===2)d.q2++; else if(q===3)d.q3++; else if(q===4)d.q4++;
    }
  }
  return d;
}
/* @cv-extract:end */
  KD.fkmExtract = extractCVfields;

        <div class="fk-inline" style="margin-top:14px"><button class="fk-btn ok" data-act="save" ${valid.length ? '' : raw('disabled')}>Simpan Semua ke Sistem (${valid.length} rekod)</button>
          <span class="fk-mini">${batch.length - valid.length} rekod dilangkau (tiada Staff ID / ralat)</span></div><div class="fk-alert green hidden" data-res style="margin-top:14px"></div>`.s;

          if (!/SUMMARY\s+REPORT/i.test(text)) { batch.push({ _file: files[i].name, _err: 'Bukan CV Akademik Summary Report — bahagian "SUMMARY REPORT" tiada.' }); continue; }
          const x = extractCVfields(text);
          x._file = files[i].name; x._summary = true;

          const r = await KD.api.call('staf.importLegacy', { sheetId: qs('#fkmSheet', w).value.trim() });
          fkm.invalidate();
          const line = (x) => x.added + ' baharu · ' + x.updated + ' dikemas kini · ' + x.unchanged + ' tiada perubahan · ' + x.errors.length + ' ralat';
          const errs = r.staf.errors.concat(r.capaian.errors);
          qs('[data-out]', w).innerHTML = html`<div class="fk-alert green"><strong>Import selesai.</strong><br>Staf: ${line(r.staf)}<br>Capaian: ${line(r.capaian)}</div>
            ${errs.length ? html`<div class="fk-section-h">Ralat</div><ul class="fk-mini">${errs.map((x) => html`<li>${x.key || '#' + x.index}: ${x.message}</li>`)}</ul>` : ''}
            ${r.warnings.length ? html`<div class="fk-section-h">Amaran (${r.warnings.length})</div><ul class="fk-mini">${r.warnings.map((x) => html`<li>${x}</li>`)}</ul>` : ''}`.s;
          toast('Import selesai.');
        } catch (err) { toastError(err); }
      });
    });
  }, { roles: ['ADMIN'], allowEmpty: true });

  /* ================================================================ LALUAN */
  const VIEW = { '/fkm/staf': 'fkmStaf', '/fkm/kenaikan': 'fkmKenaikan', '/fkm/latihan': 'fkmLatihan', '/fkm/penyelidikan': 'fkmPenyelidikan', '/fkm/geran': 'fkmGeran',
    '/fkm/penyeliaan': 'fkmPenyeliaan', '/fkm/khidmat': 'fkmKhidmat', '/fkm/myra': 'fkmMyra', '/fkm/cv': 'fkmCv', '/fkm/penasihat': 'fkmPenasihat', '/fkm/capaian': 'fkmCapaian', '/fkm/import': 'fkmImport' };
  NAV.forEach((n) => { if (VIEW[n[0]]) KD.extraRoutes.push({ path: n[0], view: VIEW[n[0]], access: n[5], layout: 'app', title: n[2], sub: n[3] }); });
  KD.extraRoutes.push({ path: '/fkm/staf/:sid', view: 'fkmProfil', access: 'user', layout: 'app', title: 'Staff Profile', navPath: '/fkm/staf' });
  /* Panel pentadbir templat: pautan kembali ke dashboard FKM */
  KD.extraNav.admin.push(['/utama', 'activity', 'Dashboard FKM']);
})(window.KD);
</script>
